[package]
name = "ruder_cam_beta"
version = "0.3.0"
authors = ["Tom Paßberg"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
dioxus = { version = "0.7.1", features = ["router", "fullstack"] }
serde = { version = "1.0", features = ["derive"] }
dioxus-sdk = { version = "0.7.0", features = ["storage"] }
tokio = { version = "1.53.3", default-features = false, optional = true }
tower = { version = "0.5.3", optional = true }
tower-http = { version = "0.7.1", features = ["fs", "cors","compression-gzip"], optional = true }
wasmtimer = { version = "0.4.3" }

[features]
tokio-server = ["dep:tokio", "tokio/full"]

web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]
server = ["dioxus/server", "tokio-server", "dep:tower", "dep:tower-http"]

