[package]
name = "ruder_cam_beta"
version = "0.3.0"
authors = ["Tom Paßberg"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
dioxus = { version = "0.7.1", features = ["router", "fullstack"] }
serde = { version = "1.0", features = ["derive"] }
dioxus-sdk = { version = "0.7.0", features = ["storage"] }
tokio = { version = "1.53.3", default-features = false, optional = true }
tower = { version = "0.5.3", optional = true }
tower-http = { version = "0.7.1", features = ["fs", "cors", "compression-gzip"], optional = true }
wasmtimer = { version = "0.4.3", optional = true }
reqwest = { version = "0.13.5", optional = true, features = ["json"] }
lazy_static = { version = "1.5.1", optional = true }
tokio-serial = { version = "5.5.0", optional = true }
futures = { version = "0.3.34", optional = true }
async-stream = { version = "0.3.6", optional = true }
chrono = { version = "0.4.45", features = ["unstable-locales"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22.4"
ndk-context = "0.1"

[target.'cfg(target_os = "linux")'.dependencies]
linux-embedded-hal = { version = "0.5.0" , optional = true }
gpiocdev = { version = "0.8.0", optional = true }
libc = { version = "0.2", optional = true }

[features]
tokio-server = ["dep:tokio", "tokio/full"]
tokio-client = ["dep:tokio", "tokio/time"]

web = ["dioxus/web", "dep:wasmtimer"]
desktop = ["dioxus/desktop", "tokio-client"]
mobile = ["dioxus/mobile", "tokio-client"]
server = [
    "dioxus/server", 
    "tokio-server", 
    "dep:tower", 
    "dep:tower-http", 
    "dep:reqwest", 
    "dep:lazy_static", 
    "dep:linux-embedded-hal", 
    "dep:gpiocdev", 
    "dep:libc",
    "dep:tokio-serial",
    "dep:futures",
    "dep:async-stream",
]

[build-dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "rustls"] }
